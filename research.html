<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockBuddy — Research</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { mono: ['"JetBrains Mono"', 'monospace'] } } } }</script>
  <script>(function(){var t=localStorage.getItem('sb_theme')||'dark';document.documentElement.setAttribute('data-theme',t);})()</script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#3fb950" />
</head>
<body>

<div id="sidebarOverlay"></div>
<nav id="sidebar"></nav>

<div class="lg:ml-56 flex flex-col min-h-screen">

  <header id="sb-topbar"></header>

  <main class="flex-1 p-4 lg:p-7 pb-24 lg:pb-7 w-full max-w-[1360px]">

    <div class="custom-wl-section" id="customWlSection">
      <div class="custom-wl-header">
        <div class="custom-wl-title">⭐ My Watchlist</div>
        <div class="custom-wl-sub">Extra tickers included in every research alongside S&amp;P 500</div>
      </div>
      <div class="custom-wl-input-row">
        <input class="port-ticker-input" id="customTickerInput" placeholder="e.g. TSLA" autocomplete="off"
               onkeydown="if(event.key==='Enter')addCustomTicker()" style="text-transform:uppercase" />
        <button class="btn btn-ghost" onclick="addCustomTicker()">+ Add</button>
      </div>
      <div id="customWlTickers" class="custom-wl-chips"></div>
    </div>

    <div class="action-bar">
      <div class="action-left">
        <div class="action-session-title" id="sessionTitle">Loading…</div>
        <div class="action-session-desc"  id="sessionDesc">Detecting session</div>
      </div>
      <div class="action-right">
        <div class="chip-anthro" id="keySaved">
          <span>● Anthropic</span>
          <button onclick="window.location.href='settings.html'">Change</button>
        </div>
        <span class="session-badge morning" id="sessionBadge">—</span>
        <select id="modelSelect">
          <option value="claude-haiku-4-5-20251001" selected>Haiku 4.5 — Fast</option>
          <option value="claude-sonnet-4-6">Sonnet 4.6 — Balanced</option>
          <option value="claude-opus-4-7">Opus 4.7 — Deep</option>
        </select>
        <button class="btn-watchlist" id="wlGenerateBtn" onclick="generateWatchlist()" disabled style="display:none">
          <span id="wlIcon">🔭</span>
          <span id="wlLabel">Research Opens</span>
        </button>
      </div>
    </div>

    <div class="error-box" id="errorBox"></div>

    <div class="loading-box" id="loadingBox">
      <div class="spinner"></div>
      <div class="loading-status"><em id="loadMsg">Initialising…</em></div>
      <div id="stepsEl"></div>
    </div>

    <div class="watchlist-section" id="watchlistSection">
      <div class="watchlist-header">
        <div>
          <div class="watchlist-title">🔭 Tomorrow's Open Watchlist</div>
          <div class="watchlist-sub" id="wlSummary"></div>
        </div>
        <div class="watchlist-catalysts" id="wlCatalysts"></div>
      </div>
      <div id="wlCards"></div>
    </div>

    <div class="timestamp" id="timestamp"></div>

  </main>
</div>

<nav id="sb-bottomnav"></nav>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>window.SB_PAGE = 'research';</script>
<script src="js/nav.js"></script>
<script src="js/shared.js"></script>
<script>
function tickSession() {
  const et   = etNow();
  const sess = sessionOf(et);
  const title  = document.getElementById('sessionTitle');
  const desc   = document.getElementById('sessionDesc');
  const badge  = document.getElementById('sessionBadge');
  const labels = {
    premarket:  ['Pre-Market Research',    'Before open — build your watchlist for today',         'morning',   'Morning Session'],
    morning:    ['Market Open',            'Market is live — use after-hours for watchlist',        'morning',   'Market Open'],
    afternoon:  ['Afternoon Session',      "Research tomorrow's open setups",                      'afternoon', '3:30 PM Session'],
    afterhours: ['After-Hours Research',   "Market closed — build watchlist for tomorrow's open",  'after',     'After Hours'],
  };
  const [t, d, cls, bl] = labels[sess];
  if (title) title.textContent = t;
  if (desc)  desc.textContent  = d;
  if (badge) { badge.textContent = bl; badge.className = 'session-badge ' + cls; }
  const marketClosed = sess === 'afterhours' || sess === 'premarket';
  const wBtn = document.getElementById('wlGenerateBtn');
  const wLbl = document.getElementById('wlLabel');
  if (wBtn) {
    wBtn.style.display = marketClosed ? 'flex' : 'none';
    if (marketClosed && localStorage.getItem('sb_key')) wBtn.disabled = false;
    if (wLbl) wLbl.textContent = sess === 'premarket' ? "Research Today's Open" : "Research Tomorrow's Open";
  }
}

function showError(msg) { const el = document.getElementById('errorBox'); el.textContent = '⚠ ' + msg; el.classList.add('active'); }
function clearError()   { document.getElementById('errorBox').classList.remove('active'); }
function updateLoad(msg){ document.getElementById('loadMsg').innerHTML = `<em>${msg}</em>`; }
function startLoading() {
  document.getElementById('loadingBox').classList.add('active');
  document.getElementById('watchlistSection').classList.remove('active');
  document.getElementById('timestamp').classList.remove('active');
  document.getElementById('stepsEl').innerHTML = '';
  updateLoad('Starting…');
}
function stopLoading() { document.getElementById('loadingBox').classList.remove('active'); }

function addCustomTicker() {
  const input  = document.getElementById('customTickerInput');
  const ticker = (input.value || '').trim().toUpperCase().replace(/[^A-Z.]/g, '');
  if (!ticker) return;
  const list = loadCustomWatchlist();
  if (!list.includes(ticker)) { list.push(ticker); saveCustomWatchlist(list); }
  input.value = '';
  renderCustomWatchlist();
}

function removeCustomTicker(ticker) {
  const list = loadCustomWatchlist().filter(t => t !== ticker);
  saveCustomWatchlist(list);
  renderCustomWatchlist();
}

function renderCustomWatchlist() {
  const list = loadCustomWatchlist();
  const el   = document.getElementById('customWlTickers');
  if (!el) return;
  el.innerHTML = list.length
    ? list.map(t => `<span class="custom-ticker-chip">${t}<button onclick="removeCustomTicker('${t}')" title="Remove">×</button></span>`).join('')
    : '<span style="color:var(--text-dimmer);font-size:12px">No custom tickers yet</span>';
}

function systemWatchlistPrompt() {
  return `You are an expert stock researcher building a pre-market watchlist for S&P 500 day traders.

Step 1: Search the web for today's news, overnight earnings, and pre-market catalysts.
Step 2: Reply with ONLY valid JSON wrapped in <json_data> tags. No other text. No markdown. No explanation.

The JSON must follow this exact structure:
<json_data>
{"date":"YYYY-MM-DD","research_summary":"2-3 sentences on the overall setup","key_catalysts":["catalyst1","catalyst2"],"watchlist":[{"ticker":"AAPL","company":"Apple Inc","sector":"Technology","thesis":"Why this is worth buying","catalyst":"Specific catalyst","buy_trigger":"Exact condition before entering, e.g. holds above $182 in first 5 min on volume","entry_point":"$XXX.XX","first_target":"$XXX.XX","stop_loss":"$XXX.XX","risk_reward":"1:2","confidence":"HIGH","confidence_pct":88,"pre_market_signal":"What to check before 9:30 AM ET"}]}
</json_data>

Hard rules:
- 5-7 picks only, BUY side only — focus on S&P 500 stocks and any custom watchlist tickers provided
- confidence_pct must be 85 or higher for every pick — drop any pick below 85%
- All price fields must be exact dollar values like "$182.45"
- Tight stops: 1-2% from entry
- Output ONLY the <json_data> block — nothing before, nothing after`;
}

function watchlistUserPrompt(priceCtx, customWl) {
  const etNow_   = etNow();
  const sess     = sessionOf(etNow_);
  const isPremarket = sess === 'premarket';
  const today = etNow_.toLocaleDateString('en-US', { timeZone:'America/New_York', weekday:'long', year:'numeric', month:'long', day:'numeric' });
  const tomorrow = new Date(etNow_.getTime() + 86400000).toLocaleDateString('en-US', { timeZone:'America/New_York', weekday:'long', year:'numeric', month:'long', day:'numeric' });
  const targetDate = isPremarket ? today : tomorrow;
  const priceLabel = isPremarket
    ? `PRE-MARKET PRICES as of ${today} (use these to set realistic entry levels for today's open):`
    : `AFTER-HOURS PRICES as of ${today} (use these to set realistic entry levels for tomorrow's open):`;
  const prices = priceCtx ? `\n${priceLabel}\n${priceCtx}\n` : '\n[No live price feed — use web search for current prices]\n';
  const customSection = customWl && customWl.length ? `\nMY WATCHLIST (prioritise these tickers if there are setups): ${customWl.join(', ')}\n` : '';
  if (isPremarket) {
    return `TODAY IS ${today.toUpperCase()}. It is pre-market — the market has NOT opened yet. You are building a watchlist for TODAY'S open (${today}).\nDO NOT say "tomorrow" — the open you are researching IS TODAY, ${today}. Do not reference any previous trading session.\n${prices}${customSection}\nSearch for: overnight news and earnings reactions, pre-market futures direction RIGHT NOW for ${today}, analyst calls published this morning, any gap-up or gap-down setups forming before today's open, macro events scheduled for today.\n\nIdentify 5-7 highest-conviction S&P 500 BUY candidates for TODAY's open (${today}). For each, define a specific buy_trigger — the exact confirmation to wait for in the first 5 minutes after 9:30 AM ET before entering. Do NOT blindly buy at the open.`;
  }
  return `TODAY IS ${today.toUpperCase()}. The market is closed for today. You are building a watchlist for TOMORROW's open (${tomorrow}).\nDO NOT recycle or repeat any analysis from previous days. Base everything on news from today, ${today}, and overnight.\n${prices}${customSection}\nSearch for: after-hours earnings reactions from today (${today}), analyst calls published today, macro events scheduled for tomorrow, weekend/overnight news if applicable, futures direction for tomorrow's open, sector rotation signals.\n\nIdentify 5-7 highest-conviction S&P 500 BUY candidates for TOMORROW's open (${tomorrow}). For each, define a specific buy_trigger — the exact confirmation to wait for in the first 5 minutes after 9:30 AM ET before entering. Do NOT blindly buy at the open.`;
}

async function generateWatchlist() {
  const apiKey = localStorage.getItem('sb_key');
  if (!apiKey) { showError('Please enter your Anthropic API key first.'); return; }
  clearError();
  const model = document.getElementById('modelSelect').value;
  const btn   = document.getElementById('wlGenerateBtn');
  const lbl   = document.getElementById('wlLabel');
  const icon  = document.getElementById('wlIcon');
  btn.disabled = true; lbl.textContent = 'Researching…'; icon.textContent = '⏳';
  startLoading();
  try {
    let priceMap = {}, priceCtx = '';
    updateLoad('📡 Fetching live prices…');
    const customWl   = loadCustomWatchlist();
    const allSymbols = [...new Set([...SP500_TICKERS, ...customWl])];
    const prices     = await fetchLivePricesYahoo(allSymbols);
    prices.forEach(p => { priceMap[p.ticker] = p; });
    priceCtx = buildPriceContext(prices);
    const wlSess = sessionOf(etNow());
    updateLoad(wlSess === 'premarket' ? '🔭 Researching today\'s open candidates…' : '🔭 Researching tomorrow\'s open candidates…');
    let messages = [{ role:'user', content: watchlistUserPrompt(priceCtx, customWl) }];
    const MAX_TURNS = 12;
    let responseData;
    for (let turn = 0; turn < MAX_TURNS; turn++) {
      let res;
      for (let attempt = 0; attempt < 5; attempt++) {
        res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: { 'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-beta':'web-search-2025-03-05','anthropic-dangerous-direct-browser-access':'true' },
          body: JSON.stringify({ model, max_tokens:8000, tool_choice:{type:'auto',disable_parallel_tool_use:true}, tools:[{type:'web_search_20250305',name:'web_search'}], system:systemWatchlistPrompt(), messages }),
        });
        if (res.status !== 429 && res.status !== 529) break;
        const wait = parseInt(res.headers.get('retry-after') || '60', 10);
        for (let s = wait; s > 0; s--) { updateLoad(`⏳ Rate limit — retrying in ${s}s…`); await new Promise(r => setTimeout(r, 1000)); }
      }
      if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.error?.message || `HTTP ${res.status}`); }
      const data = await res.json();
      if (data.type === 'error') throw new Error(data.error?.message || 'API error');
      if (data.stop_reason === 'end_turn') { responseData = data; break; }
      if (data.stop_reason === 'tool_use') {
        const results = data.content.filter(b=>b.type==='tool_use').map(b=>({type:'tool_result',tool_use_id:b.id,content:[]}));
        const assistantContent = data.content.filter(b=>b.type!=='tool_result');
        messages = [messages[0],{role:'assistant',content:assistantContent},...(results.length?[{role:'user',content:results}]:[])];
        continue;
      }
      responseData = data; break;
    }
    if (!responseData) throw new Error('No response received. Please try again.');
    updateLoad('✅ Building watchlist…');
    const text = extractText(responseData);
    if (!text.trim()) throw new Error('Empty response — please try again.');
    let analysis;
    try { analysis = sanitizeParsed(parseAnalysis(text)); }
    catch (parseErr) {
      if (!parseErr.message.startsWith('PARSE_FAIL:')) throw parseErr;
      updateLoad('⚠ Reformatting response…');
      const fixedText = await reformatAsJson(apiKey, model, text);
      analysis = sanitizeParsed(parseAnalysis(fixedText));
    }
    (analysis.watchlist || []).forEach(s => {
      const p = priceMap[s.ticker]; if (!p) return;
      if (p.extPrice != null) { s.live_price = p.extPrice; s.live_dp = p.extDp||0; s.price_is_close = false; s.is_extended = true; s.ext_session = wlSess; s.prev_close = p.prevClose||null; }
      else { s.live_price = p.price; s.live_dp = p.dp; s.price_is_close = true; s.is_extended = false; s.prev_close = p.prevClose||null; }
    });
    renderWatchlist(analysis);
  } catch (err) {
    const msg = err.message.startsWith('PARSE_FAIL:')
      ? 'Could not parse response as JSON.\n\nWhat Claude returned:\n' + err.message.slice(11) : err.message;
    showError(msg);
  } finally {
    stopLoading(); btn.disabled = false; lbl.textContent = 'Refresh Watchlist'; icon.textContent = '🔭';
  }
}

function renderWatchlist(analysis) {
  const isPremarket = sessionOf(etNow()) === 'premarket';
  document.querySelector('.watchlist-title').textContent = isPremarket ? "🔭 Today's Open Watchlist" : "🔭 Tomorrow's Open Watchlist";
  document.getElementById('wlSummary').textContent = analysis.research_summary || '';
  const catalystsEl = document.getElementById('wlCatalysts');
  catalystsEl.innerHTML = (analysis.key_catalysts || []).map(c => `<span class="catalyst-tag">${c}</span>`).join('');
  const wlCards = analysis.watchlist || [];
  document.getElementById('wlCards').innerHTML = `<div class="wl-cards-grid">${wlCards.map(wlCardHTML).join('')}</div>`;
  document.getElementById('watchlistSection').classList.add('active');
  const ts = new Date().toLocaleString('en-US', { timeZone:'America/New_York', dateStyle:'full', timeStyle:'medium' });
  const tsEl = document.getElementById('timestamp');
  tsEl.textContent = 'Watchlist generated: ' + ts + ' ET';
  tsEl.classList.add('active');
}

requireAuth(function(user) {
  initSharedUI('research');
  setInterval(tickSession, 1000);
  tickSession();
  renderCustomWatchlist();
  const keySavedChip = document.getElementById('keySaved');
  if (keySavedChip && localStorage.getItem('sb_key')) keySavedChip.classList.add('visible');
  const sess = sessionOf(etNow());
  const generateBtn = document.getElementById('wlGenerateBtn');
  if (generateBtn) {
    const marketClosed = sess === 'premarket' || sess === 'afterhours';
    generateBtn.style.display = marketClosed ? 'flex' : 'none';
    if (marketClosed && localStorage.getItem('sb_key')) generateBtn.disabled = false;
    const wlLbl = document.getElementById('wlLabel');
    if (wlLbl) wlLbl.textContent = sess === 'premarket' ? "Research Today's Open" : "Research Tomorrow's Open";
  }
  const saved = localStorage.getItem('sb_model');
  if (saved) { const sel = document.getElementById('modelSelect'); if (sel) sel.value = saved; }
});
</script>
</body>
</html>
