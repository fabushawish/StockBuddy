<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="#0f1318"/>

  <!-- Ascending bars (candlestick style) -->
  <!-- Bar 1 - left, short -->
  <rect x="9" y="44" width="10" height="12" rx="2" fill="#3fb950"/>
  <!-- Wick 1 -->
  <line x1="14" y1="38" x2="14" y2="44" stroke="#3fb950" stroke-width="2" stroke-linecap="round"/>

  <!-- Bar 2 - middle -->
  <rect x="27" y="34" width="10" height="22" rx="2" fill="#3fb950"/>
  <!-- Wick 2 -->
  <line x1="32" y1="27" x2="32" y2="34" stroke="#3fb950" stroke-width="2" stroke-linecap="round"/>

  <!-- Bar 3 - right, tall -->
  <rect x="45" y="20" width="10" height="36" rx="2" fill="#3fb950"/>
  <!-- Wick 3 -->
  <line x1="50" y1="13" x2="50" y2="20" stroke="#3fb950" stroke-width="2" stroke-linecap="round"/>

  <!-- Trend arrow line -->
  <polyline
    points="14,38 32,27 50,13"
    stroke="#3fb950"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-dasharray="3 2"
    fill="none"
    opacity="0.55"
  />

  <!-- Small sparkle dot at peak -->
  <circle cx="50" cy="11" r="2.5" fill="#3fb950" opacity="0.9"/>
</svg>
