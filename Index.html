<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Apex Analyst — AI Market Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --radius: 10px;
    --radius-sm: 6px;
    --transition: 0.18s ease;
    --font: 'DM Sans', system-ui, sans-serif;
    --mono: 'DM Mono', monospace;
  }

  [data-theme="dark"] {
    --bg:        #0f1117;
    --bg2:       #161b27;
    --bg3:       #1d2333;
    --border:    #262d3f;
    --border2:   #2e3650;
    --text:      #e2e8f0;
    --text2:     #8896b0;
    --text3:     #4a5568;
    --accent:    #3b82f6;
    --accent-bg: rgba(59,130,246,0.08);
    --accent-border: rgba(59,130,246,0.25);
    --green:     #10b981;
    --green-bg:  rgba(16,185,129,0.08);
    --red:       #ef4444;
    --red-bg:    rgba(239,68,68,0.08);
    --amber:     #f59e0b;
    --amber-bg:  rgba(245,158,11,0.08);
    --shadow:    0 1px 3px rgba(0,0,0,0.4), 0 4px 16px rgba(0,0,0,0.3);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  }

  [data-theme="light"] {
    --bg:        #f8f9fc;
    --bg2:       #ffffff;
    --bg3:       #f0f2f8;
    --border:    #e2e8f0;
    --border2:   #d0d9e8;
    --text:      #1a202c;
    --text2:     #4a5568;
    --text3:     #a0aec0;
    --accent:    #2563eb;
    --accent-bg: rgba(37,99,235,0.06);
    --accent-border: rgba(37,99,235,0.2);
    --green:     #059669;
    --green-bg:  rgba(5,150,105,0.07);
    --red:       #dc2626;
    --red-bg:    rgba(220,38,38,0.07);
    --amber:     #d97706;
    --amber-bg:  rgba(217,119,6,0.07);
    --shadow:    0 1px 3px rgba(0,0,0,0.07), 0 4px 16px rgba(0,0,0,0.05);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.06);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
    transition: background var(--transition), color var(--transition);
    -webkit-font-smoothing: antialiased;
  }

  /* ── Layout ── */
  .layout {
    display: grid;
    grid-template-rows: 56px 1fr;
    grid-template-columns: 280px 1fr;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Top bar ── */
  .topbar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg2);
    gap: 16px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }

  .brand-icon {
    width: 28px; height: 28px;
    background: var(--accent);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .brand-icon svg { display: block; }

  .brand-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  .brand-tag {
    font-size: 11px;
    color: var(--text3);
    font-weight: 400;
    margin-left: 2px;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .pill {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    font-size: 11px;
    color: var(--text2);
    font-family: var(--mono);
    background: var(--bg3);
  }

  .pill-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
    animation: blink 2.5s ease-in-out infinite;
  }

  @keyframes blink {
    0%,100% { opacity:1; }
    50% { opacity:0.35; }
  }

  .icon-btn {
    width: 32px; height: 32px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all var(--transition);
    flex-shrink: 0;
  }

  .icon-btn:hover { background: var(--bg3); color: var(--text); }

  /* ── Sidebar ── */
  .sidebar {
    border-right: 1px solid var(--border);
    background: var(--bg2);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 16px;
    gap: 24px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .sidebar-section {}

  .sidebar-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 10px;
  }

  /* Holdings */
  .holding-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 10px;
    border-radius: var(--radius-sm);
    background: var(--bg3);
    border: 1px solid var(--border);
    margin-bottom: 5px;
    transition: border-color var(--transition);
  }

  .holding-row:hover { border-color: var(--border2); }

  .holding-ticker {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    color: var(--accent);
  }

  .holding-detail {
    font-size: 11px;
    color: var(--text2);
    font-family: var(--mono);
  }

  .remove-btn {
    width: 18px; height: 18px;
    border-radius: 4px;
    border: none;
    background: transparent;
    color: var(--text3);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    line-height: 1;
    transition: all var(--transition);
    flex-shrink: 0;
    padding: 0;
  }

  .remove-btn:hover { background: var(--red-bg); color: var(--red); }

  .add-holding-form {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }

  .input-sm {
    flex: 1;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg3);
    color: var(--text);
    font-family: var(--mono);
    font-size: 11px;
    outline: none;
    transition: border-color var(--transition);
  }

  .input-sm:focus { border-color: var(--accent); }
  .input-sm::placeholder { color: var(--text3); }

  .btn-add {
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg3);
    color: var(--text2);
    font-size: 13px;
    cursor: pointer;
    transition: all var(--transition);
    flex-shrink: 0;
  }

  .btn-add:hover { background: var(--accent-bg); border-color: var(--accent-border); color: var(--accent); }

  /* Quick prompts */
  .quick-prompt {
    width: 100%;
    text-align: left;
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    background: transparent;
    color: var(--text2);
    font-family: var(--font);
    font-size: 12.5px;
    cursor: pointer;
    transition: all var(--transition);
    display: block;
    line-height: 1.4;
  }

  .quick-prompt:hover {
    background: var(--accent-bg);
    border-color: var(--accent-border);
    color: var(--accent);
  }

  /* ── Main ── */
  .main {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
  }

  /* Tabs */
  .tabs {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 10px 20px 0;
    border-bottom: 1px solid var(--border);
    background: var(--bg2);
  }

  .tab {
    padding: 7px 14px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text2);
    border: none;
    background: transparent;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all var(--transition);
    border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  }

  .tab:hover { color: var(--text); }

  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .tab-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px; height: 16px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-size: 9px;
    font-weight: 700;
    margin-left: 5px;
    vertical-align: middle;
  }

  /* Chat */
  .chat-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 24px 24px 8px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  /* Empty state */
  .empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
    padding: 40px;
  }

  .empty-icon-wrap {
    width: 52px; height: 52px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--bg2);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 4px;
    box-shadow: var(--shadow-sm);
  }

  .empty-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }

  .empty-sub {
    font-size: 13px;
    color: var(--text2);
    max-width: 320px;
    line-height: 1.6;
  }

  .empty-chips {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    margin-top: 4px;
  }

  .chip {
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg2);
    font-size: 12px;
    color: var(--text2);
    cursor: pointer;
    transition: all var(--transition);
    box-shadow: var(--shadow-sm);
  }

  .chip:hover {
    border-color: var(--accent-border);
    background: var(--accent-bg);
    color: var(--accent);
  }

  /* Messages */
  .msg { display: flex; flex-direction: column; gap: 5px; animation: fadeUp 0.2s ease; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg-meta {
    font-size: 10.5px;
    color: var(--text3);
    font-family: var(--mono);
    padding: 0 2px;
  }

  .msg-bubble {
    padding: 14px 16px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    line-height: 1.7;
    font-size: 13.5px;
    box-shadow: var(--shadow-sm);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg-user .msg-bubble {
    background: var(--accent-bg);
    border-color: var(--accent-border);
    color: var(--text);
    max-width: 80%;
    align-self: flex-end;
  }

  .msg-user { align-items: flex-end; }

  .msg-ai .msg-bubble {
    background: var(--bg2);
    color: var(--text);
  }

  /* Loading */
  .typing {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 14px 16px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg2);
    width: fit-content;
    box-shadow: var(--shadow-sm);
  }

  .typing span {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--text3);
    display: inline-block;
    animation: dot 1.3s ease-in-out infinite;
  }

  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes dot {
    0%,60%,100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* Rec cards */
  .recs-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px;
    margin-top: 14px;
  }

  .rec-card {
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg);
    padding: 14px;
    box-shadow: var(--shadow-sm);
    transition: box-shadow var(--transition), border-color var(--transition);
  }

  .rec-card:hover { border-color: var(--border2); box-shadow: var(--shadow); }

  .rec-card.buy  { border-left: 3px solid var(--green); }
  .rec-card.sell { border-left: 3px solid var(--red); }
  .rec-card.hold { border-left: 3px solid var(--amber); }

  .rec-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }

  .rec-ticker {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
  }

  .action-badge {
    font-size: 10px;
    font-weight: 600;
    font-family: var(--mono);
    letter-spacing: 0.05em;
    padding: 2px 8px;
    border-radius: 4px;
  }

  .action-badge.buy  { background: var(--green-bg); color: var(--green); }
  .action-badge.sell { background: var(--red-bg);   color: var(--red); }
  .action-badge.hold { background: var(--amber-bg); color: var(--amber); }

  .rec-name {
    font-size: 11px;
    color: var(--text2);
    margin-bottom: 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .conf-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 5px;
    font-size: 11px;
    color: var(--text2);
  }

  .conf-val { font-weight: 600; font-family: var(--mono); }
  .conf-val.buy  { color: var(--green); }
  .conf-val.sell { color: var(--red); }
  .conf-val.hold { color: var(--amber); }

  .conf-bar {
    height: 3px;
    background: var(--bg3);
    border-radius: 2px;
    margin-bottom: 12px;
    overflow: hidden;
  }

  .conf-fill { height: 100%; border-radius: 2px; transition: width 0.5s ease; }
  .conf-fill.buy  { background: var(--green); }
  .conf-fill.sell { background: var(--red); }
  .conf-fill.hold { background: var(--amber); }

  .price-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  .price-item {}

  .price-label {
    font-size: 9.5px;
    color: var(--text3);
    font-family: var(--mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .price-val {
    font-size: 12px;
    font-family: var(--mono);
    font-weight: 500;
    color: var(--text);
    margin-top: 1px;
  }

  /* Recs tab */
  .recs-tab-wrap { flex: 1; overflow-y: auto; padding: 24px; }

  /* Input bar */
  .input-bar {
    padding: 12px 20px 16px;
    border-top: 1px solid var(--border);
    background: var(--bg2);
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

  .textarea-wrap { flex: 1; position: relative; }

  #chat-input {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg3);
    color: var(--text);
    font-family: var(--font);
    font-size: 13.5px;
    resize: none;
    outline: none;
    line-height: 1.5;
    max-height: 120px;
    overflow-y: auto;
    transition: border-color var(--transition);
    display: block;
  }

  #chat-input:focus { border-color: var(--accent); background: var(--bg2); }
  #chat-input::placeholder { color: var(--text3); }

  .send-btn {
    width: 38px;
    height: 38px;
    border-radius: var(--radius);
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all var(--transition);
    flex-shrink: 0;
    box-shadow: 0 1px 4px rgba(59,130,246,0.3);
  }

  .send-btn:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
  .send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

  /* Divider in messages */
  .parsed-label {
    font-size: 10px;
    font-family: var(--mono);
    color: var(--text3);
    margin-top: 16px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .parsed-label::before,
  .parsed-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  @media (max-width: 700px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { display: none; }
  }
</style>
</head>

  <!-- Sidebar -->
  <aside class="sidebar">

    <div class="sidebar-section">

        <button class="btn-add" id="add-btn" title="Add holding">+</button>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Quick Actions</div>
      <div id="quick-list"></div>
    </div>

  </aside>

  <!-- Main -->
  <main class="main">

    <div class="tabs">

      <button class="tab" data-tab="recs" id="recs-tab-btn">
        Recommendations<span class="tab-badge" id="recs-badge" style="display:none">0</span>
      </button>
    </div>

    <!-- Chat pane -->
    <div id="pane-chat" style="display:flex;flex-direction:column;flex:1;overflow:hidden;">
      <div class="chat-wrap" id="chat-wrap">
        <div class="empty" id="empty-state">
          <div class="empty-icon-wrap">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text3)">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
            </svg>
          </div>
          <div class="empty-title">Ready to analyse</div>
          <div class="empty-sub">Add your holdings in the sidebar, then ask for a market report or trading ideas.</div>
          <div class="empty-chips" id="empty-chips"></div>
        </div>
        <div id="messages"></div>
        <div id="loading-indicator" style="display:none">

            <div class="msg-meta">Apex Analyst</div>
            <div class="typing"><span></span><span></span><span></span></div>
          </div>
        </div>
      </div>
      <div class="input-bar">
        <div class="textarea-wrap">
          <textarea id="chat-input" rows="1" placeholder="Ask for a market analysis, portfolio review, trading ideas…"></textarea>
        </div>
        <button class="sen
