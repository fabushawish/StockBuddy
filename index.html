<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Apex Analyst — AI Market Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --radius: 10px;
    --radius-sm: 6px;
    --transition: 0.18s ease;
    --font: 'DM Sans', system-ui, sans-serif;
    --mono: 'DM Mono', monospace;
  }

  [data-theme="dark"] {
    --bg:        #0f1117;
    --bg2:       #161b27;
    --bg3:       #1d2333;
    --border:    #262d3f;
    --border2:   #2e3650;
    --text:      #e2e8f0;
    --text2:     #8896b0;
    --text3:     #4a5568;
    --accent:    #3b82f6;
    --accent-bg: rgba(59,130,246,0.08);
    --accent-border: rgba(59,130,246,0.25);
    --green:     #10b981;
    --green-bg:  rgba(16,185,129,0.08);
    --red:       #ef4444;
    --red-bg:    rgba(239,68,68,0.08);
    --amber:     #f59e0b;
    --amber-bg:  rgba(245,158,11,0.08);
    --shadow:    0 1px 3px rgba(0,0,0,0.4), 0 4px 16px rgba(0,0,0,0.3);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  }

  [data-theme="light"] {
    --bg:        #f8f9fc;
    --bg2:       #ffffff;
    --bg3:       #f0f2f8;
    --border:    #e2e8f0;
    --border2:   #d0d9e8;
    --text:      #1a202c;
    --text2:     #4a5568;
    --text3:     #a0aec0;
    --accent:    #2563eb;
    --accent-bg: rgba(37,99,235,0.06);
    --accent-border: rgba(37,99,235,0.2);
    --green:     #059669;
    --green-bg:  rgba(5,150,105,0.07);
    --red:       #dc2626;
    --red-bg:    rgba(220,38,38,0.07);
    --amber:     #d97706;
    --amber-bg:  rgba(217,119,6,0.07);
    --shadow:    0 1px 3px rgba(0,0,0,0.07), 0 4px 16px rgba(0,0,0,0.05);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.06);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
    transition: background var(--transition), color var(--transition);
    -webkit-font-smoothing: antialiased;
  }

  /* ── Layout ── */
  .layout {
    display: grid;
    grid-template-rows: 56px 1fr;
    grid-template-columns: 280px 1fr;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Top bar ── */
  .topbar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg2);
    gap: 16px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }

  .brand-icon {
    width: 28px; height: 28px;
    background: var(--accent);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .brand-icon svg { display: block; }

  .brand-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  .brand-tag {
    font-size: 11px;
    color: var(--text3);
    font-weight: 400;
    margin-left: 2px;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .pill {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    font-size: 11px;
    color: var(--text2);
    font-family: var(--mono);
    background: var(--bg3);
  }

  .pill-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
    animation: blink 2.5s ease-in-out infinite;
  }

  @keyframes blink {
    0%,100% { opacity:1; }
    50% { opacity:0.35; }
  }

  .icon-btn {
    width: 32px; height: 32px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all var(--transition);
    flex-shrink: 0;
  }

  .icon-btn:hover { background: var(--bg3); color: var(--text); }

  /* ── Sidebar ── */
  .sidebar {
    border-right: 1px solid var(--border);
    background: var(--bg2);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 16px;
    gap: 24px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .sidebar-section {}

  .sidebar-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 10px;
  }

  /* Holdings */
  .holding-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 10px;
    border-radius: var(--radius-sm);
    background: var(--bg3);
    border: 1px solid var(--border);
    margin-bottom: 5px;
    transition: border-color var(--transition);
  }

  .holding-row:hover { border-color: var(--border2); }

  .holding-ticker {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    color: var(--accent);
  }

  .holding-detail {
    font-size: 11px;
    color: var(--text2);
    font-family: var(--mono);
  }

  .remove-btn {
    width: 18px; height: 18px;
    border-radius: 4px;
    border: none;
    background: transparent;
    color: var(--text3);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    line-height: 1;
    transition: all var(--transition);
    flex-shrink: 0;
    padding: 0;
  }

  .remove-btn:hover { background: var(--red-bg); color: var(--red); }

  .add-holding-form {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }

  .input-sm {
    flex: 1;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg3);
    color: var(--text);
    font-family: var(--mono);
    font-size: 11px;
    outline: none;
    transition: border-color var(--transition);
  }

  .input-sm:focus { border-color: var(--accent); }
  .input-sm::placeholder { color: var(--text3); }

  .btn-add {
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg3);
    color: var(--text2);
    font-size: 13px;
    cursor: pointer;
    transition: all var(--transition);
    flex-shrink: 0;
  }

  .btn-add:hover { background: var(--accent-bg); border-color: var(--accent-border); color: var(--accent); }

  /* Quick prompts */
  .quick-prompt {
    width: 100%;
    text-align: left;
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    background: transparent;
    color: var(--text2);
    font-family: var(--font);
    font-size: 12.5px;
    cursor: pointer;
    transition: all var(--transition);
    display: block;
    line-height: 1.4;
  }

  .quick-prompt:hover {
    background: var(--accent-bg);
    border-color: var(--accent-border);
    color: var(--accent);
  }

  /* ── Main ── */
  .main {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
  }

  /* Tabs */
  .tabs {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 10px 20px 0;
    border-bottom: 1px solid var(--border);
    background: var(--bg2);
  }

  .tab {
    padding: 7px 14px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text2);
    border: none;
    background: transparent;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all var(--transition);
    border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  }

  .tab:hover { color: var(--text); }

  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .tab-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px; height: 16px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-size: 9px;
    font-weight: 700;
    margin-left: 5px;
    vertical-align: middle;
  }

  /* Chat */
  .chat-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 24px 24px 8px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  /* Empty state */
  .empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
    padding: 40px;
  }

  .empty-icon-wrap {
    width: 52px; height: 52px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--bg2);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 4px;
    box-shadow: var(--shadow-sm);
  }

  .empty-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }

  .empty-sub {
    font-size: 13px;
    color: var(--text2);
    max-width: 320px;
    line-height: 1.6;
  }

  .empty-chips {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    margin-top: 4px;
  }

  .chip {
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg2);
    font-size: 12px;
    color: var(--text2);
    cursor: pointer;
    transition: all var(--transition);
    box-shadow: var(--shadow-sm);
  }

  .chip:hover {
    border-color: var(--accent-border);
    background: var(--accent-bg);
    color: var(--accent);
  }

  /* Messages */
  .msg { display: flex; flex-direction: column; gap: 5px; animation: fadeUp 0.2s ease; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg-meta {
    font-size: 10.5px;
    color: var(--text3);
    font-family: var(--mono);
    padding: 0 2px;
  }

  .msg-bubble {
    padding: 14px 16px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    line-height: 1.7;
    font-size: 13.5px;
    box-shadow: var(--shadow-sm);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg-user .msg-bubble {
    background: var(--accent-bg);
    border-color: var(--accent-border);
    color: var(--text);
    max-width: 80%;
    align-self: flex-end;
  }

  .msg-user { align-items: flex-end; }

  .msg-ai .msg-bubble {
    background: var(--bg2);
    color: var(--text);
  }

  /* Loading */
  .typing {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 14px 16px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg2);
    width: fit-content;
    box-shadow: var(--shadow-sm);
  }

  .typing span {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--text3);
    display: inline-block;
    animation: dot 1.3s ease-in-out infinite;
  }

  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes dot {
    0%,60%,100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* Rec cards */
  .recs-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px;
    margin-top: 14px;
  }

  .rec-card {
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg);
    padding: 14px;
    box-shadow: var(--shadow-sm);
    transition: box-shadow var(--transition), border-color var(--transition);
  }

  .rec-card:hover { border-color: var(--border2); box-shadow: var(--shadow); }

  .rec-card.buy  { border-left: 3px solid var(--green); }
  .rec-card.sell { border-left: 3px solid var(--red); }
  .rec-card.hold { border-left: 3px solid var(--amber); }

  .rec-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }

  .rec-ticker {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
  }

  .action-badge {
    font-size: 10px;
    font-weight: 600;
    font-family: var(--mono);
    letter-spacing: 0.05em;
    padding: 2px 8px;
    border-radius: 4px;
  }

  .action-badge.buy  { background: var(--green-bg); color: var(--green); }
  .action-badge.sell { background: var(--red-bg);   color: var(--red); }
  .action-badge.hold { background: var(--amber-bg); color: var(--amber); }

  .rec-name {
    font-size: 11px;
    color: var(--text2);
    margin-bottom: 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .conf-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 5px;
    font-size: 11px;
    color: var(--text2);
  }

  .conf-val { font-weight: 600; font-family: var(--mono); }
  .conf-val.buy  { color: var(--green); }
  .conf-val.sell { color: var(--red); }
  .conf-val.hold { color: var(--amber); }

  .conf-bar {
    height: 3px;
    background: var(--bg3);
    border-radius: 2px;
    margin-bottom: 12px;
    overflow: hidden;
  }

  .conf-fill { height: 100%; border-radius: 2px; transition: width 0.5s ease; }
  .conf-fill.buy  { background: var(--green); }
  .conf-fill.sell { background: var(--red); }
  .conf-fill.hold { background: var(--amber); }

  .price-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  .price-item {}

  .price-label {
    font-size: 9.5px;
    color: var(--text3);
    font-family: var(--mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .price-val {
    font-size: 12px;
    font-family: var(--mono);
    font-weight: 500;
    color: var(--text);
    margin-top: 1px;
  }

  /* Recs tab */
  .recs-tab-wrap { flex: 1; overflow-y: auto; padding: 24px; }

  /* Input bar */
  .input-bar {
    padding: 12px 20px 16px;
    border-top: 1px solid var(--border);
    background: var(--bg2);
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

  .textarea-wrap { flex: 1; position: relative; }

  #chat-input {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg3);
    color: var(--text);
    font-family: var(--font);
    font-size: 13.5px;
    resize: none;
    outline: none;
    line-height: 1.5;
    max-height: 120px;
    overflow-y: auto;
    transition: border-color var(--transition);
    display: block;
  }

  #chat-input:focus { border-color: var(--accent); background: var(--bg2); }
  #chat-input::placeholder { color: var(--text3); }

  .send-btn {
    width: 38px;
    height: 38px;
    border-radius: var(--radius);
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all var(--transition);
    flex-shrink: 0;
    box-shadow: 0 1px 4px rgba(59,130,246,0.3);
  }

  .send-btn:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
  .send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

  /* Divider in messages */
  .parsed-label {
    font-size: 10px;
    font-family: var(--mono);
    color: var(--text3);
    margin-top: 16px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .parsed-label::before,
  .parsed-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  @media (max-width: 700px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { display: none; }
  }
</style>
</head>
<body>

<div class="layout">

  <!-- Top bar -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M8 2L14 5.5V10.5L8 14L2 10.5V5.5L8 2Z" fill="white" fill-opacity="0.9"/>
          <path d="M5 8L7.5 10.5L11 6.5" stroke="rgba(37,99,235,1)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="brand-name">Apex Analyst <span class="brand-tag">/ AI Market Intelligence</span></span>
    </div>
    <div class="topbar-right">
      <div class="pill"><div class="pill-dot"></div>Live</div>
      <button class="icon-btn" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
        <svg id="theme-icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
        </svg>
        <svg id="theme-icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar">

    <div class="sidebar-section">
      <div class="sidebar-label">Portfolio Holdings</div>
      <div id="holdings-list"></div>
      <div class="add-holding-form">
        <input class="input-sm" id="new-ticker" type="text" placeholder="TICKER" maxlength="6" style="text-transform:uppercase;width:80px;flex:none"/>
        <input class="input-sm" id="new-shares" type="number" placeholder="Shares" style="width:70px;flex:none"/>
        <button class="btn-add" id="add-btn" title="Add holding">+</button>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Quick Actions</div>
      <div id="quick-list"></div>
    </div>

  </aside>

  <!-- Main -->
  <main class="main">

    <div class="tabs">
      <button class="tab active" data-tab="chat">Chat</button>
      <button class="tab" data-tab="recs" id="recs-tab-btn">
        Recommendations<span class="tab-badge" id="recs-badge" style="display:none">0</span>
      </button>
    </div>

    <!-- Chat pane -->
    <div id="pane-chat" style="display:flex;flex-direction:column;flex:1;overflow:hidden;">
      <div class="chat-wrap" id="chat-wrap">
        <div class="empty" id="empty-state">
          <div class="empty-icon-wrap">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text3)">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
            </svg>
          </div>
          <div class="empty-title">Ready to analyse</div>
          <div class="empty-sub">Add your holdings in the sidebar, then ask for a market report or trading ideas.</div>
          <div class="empty-chips" id="empty-chips"></div>
        </div>
        <div id="messages"></div>
        <div id="loading-indicator" style="display:none">
          <div class="msg msg-ai">
            <div class="msg-meta">Apex Analyst</div>
            <div class="typing"><span></span><span></span><span></span></div>
          </div>
        </div>
      </div>
      <div class="input-bar">
        <div class="textarea-wrap">
          <textarea id="chat-input" rows="1" placeholder="Ask for a market analysis, portfolio review, trading ideas…"></textarea>
        </div>
        <button class="send-btn" id="send-btn" disabled title="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Recs pane -->
    <div id="pane-recs" style="display:none;flex:1;overflow:hidden;">
      <div class="recs-tab-wrap">
        <div id="recs-content"></div>
      </div>
    </div>

  </main>
</div>

<script>
/* ─────────────────────────────────────────────
   State
───────────────────────────────────────────── */
let holdings = [
  { ticker: "AAPL", shares: 50, avgCost: 172 },
  { ticker: "MSFT", shares: 30, avgCost: 385 },
  { ticker: "SPY",  shares: 20, avgCost: 520 },
];
let messages = [];   // { role, content, time, recs? }
let latestRecs = [];
let loading = false;
let activeTab = "chat";

const QUICK_PROMPTS = [
  "Generate my morning pre-market report",
  "Give me a midday market update",
  "Find momentum breakout opportunities",
  "Review my portfolio for risk concentration",
  "Top ETF opportunities this week",
];

const SYSTEM_PROMPT = `You are an advanced AI-powered investment analyst and portfolio manager (Apex Analyst).

ROLE & OBJECTIVE
Maximize short- to mid-term portfolio growth (1 day to 3 months) using technical analysis, news/sentiment analysis, portfolio-aware decision making, and continuous learning.

MARKET SCOPE
- US equities, Canadian equities, ETFs (index, sector, thematic)
- Strictly exclude: market cap < $2B, penny stocks, illiquid assets

STRATEGY PROFILE
- Time horizon: 1 day to 3 months
- Risk tolerance: Medium to high
- Style: Growth + blended (momentum + opportunity-driven)

ANALYSIS REQUIREMENTS
Each recommendation MUST include:
1. Technical Indicators: RSI, MACD, 20/50/200-day MAs, volume trends, support/resistance
2. News & Sentiment: recent catalysts, market sentiment (bullish/bearish/neutral), sector momentum
3. Contextual Signals: macro factors (rates, CPI), sector rotation

PORTFOLIO INTELLIGENCE
- Always incorporate current holdings
- Adjust for sector exposure (max 30% per sector)
- Track risk concentration

DECISION RULES
- Only recommend with confidence ≥ 65%
- Prioritise risk-adjusted returns
- Flag high-volatility setups
- Avoid correlated trades

OUTPUT FORMAT
Max 10 recommendations, ranked by confidence.

SECTION 1 — EXECUTIVE SUMMARY
Ranked list: Ticker — Action — Confidence% — one-line reason

SECTION 2 — DETAILED ANALYSIS
For each: Ticker, Company Name, Action (BUY/SELL/HOLD), Confidence %, Entry Price, Target Price, Stop Loss, Holding Period, Technical Summary, Sentiment Summary, Catalyst, Reasoning

TRANSPARENCY NOTE
You don't have real-time market data. Always state you're working from knowledge up to your training cutoff and that users should verify prices before acting.

STYLE
Concise, precise, no filler. Every claim grounded in data or signals.

At the very end of your response, append a JSON block (and nothing after it) in this exact format:
\`\`\`json
{"recommendations":[{"ticker":"AAPL","name":"Apple Inc.","action":"BUY","confidence":78,"entry":175.00,"target":195.00,"stopLoss":165.00,"holdingPeriod":"4–6 weeks","sentiment":"bullish"}]}
\`\`\``;

/* ─────────────────────────────────────────────
   DOM refs
───────────────────────────────────────────── */
const holdingsList = document.getElementById("holdings-list");
const quickList    = document.getElementById("quick-list");
const emptyState   = document.getElementById("empty-state");
const emptyChips   = document.getElementById("empty-chips");
const messagesEl   = document.getElementById("messages");
const loadingEl    = document.getElementById("loading-indicator");
const chatWrap     = document.getElementById("chat-wrap");
const chatInput    = document.getElementById("chat-input");
const sendBtn      = document.getElementById("send-btn");
const recsContent  = document.getElementById("recs-content");
const recsBadge    = document.getElementById("recs-badge");
const recsTabBtn   = document.getElementById("recs-tab-btn");
const newTickerEl  = document.getElementById("new-ticker");
const newSharesEl  = document.getElementById("new-shares");
const addBtn       = document.getElementById("add-btn");
const themeToggle  = document.getElementById("theme-toggle");
const moonIcon     = document.getElementById("theme-icon-moon");
const sunIcon      = document.getElementById("theme-icon-sun");

/* ─────────────────────────────────────────────
   Theme
───────────────────────────────────────────── */
function setTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  if (t === "dark") { moonIcon.style.display = "block"; sunIcon.style.display = "none"; }
  else              { moonIcon.style.display = "none";  sunIcon.style.display = "block"; }
  localStorage.setItem("apex-theme", t);
}

themeToggle.addEventListener("click", () => {
  const current = document.documentElement.getAttribute("data-theme");
  setTheme(current === "dark" ? "light" : "dark");
});

// Load saved theme
const savedTheme = localStorage.getItem("apex-theme") || "dark";
setTheme(savedTheme);

/* ─────────────────────────────────────────────
   Tabs
───────────────────────────────────────────── */
document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {
    activeTab = btn.dataset.tab;
    document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.tab === activeTab));
    document.getElementById("pane-chat").style.display = activeTab === "chat" ? "flex" : "none";
    document.getElementById("pane-recs").style.display = activeTab === "recs" ? "flex" : "none";
  });
});

/* ─────────────────────────────────────────────
   Holdings
───────────────────────────────────────────── */
function renderHoldings() {
  holdingsList.innerHTML = holdings.map((h, i) => `
    <div class="holding-row">
      <div>
        <span class="holding-ticker">${h.ticker}</span>
        <span class="holding-detail" style="margin-left:8px">${h.shares} sh${h.avgCost ? " · $"+h.avgCost : ""}</span>
      </div>
      <button class="remove-btn" onclick="removeHolding(${i})" title="Remove">×</button>
    </div>
  `).join("");
}

window.removeHolding = function(i) {
  holdings.splice(i, 1);
  renderHoldings();
};

addBtn.addEventListener("click", addHolding);
newTickerEl.addEventListener("keydown", e => { if (e.key === "Enter") addHolding(); });

function addHolding() {
  const t = newTickerEl.value.trim().toUpperCase();
  if (!t) return;
  const shares = parseFloat(newSharesEl.value) || 0;
  holdings.push({ ticker: t, shares, avgCost: 0 });
  newTickerEl.value = ""; newSharesEl.value = "";
  renderHoldings();
}

/* ─────────────────────────────────────────────
   Quick prompts
───────────────────────────────────────────── */
function renderQuick() {
  quickList.innerHTML = QUICK_PROMPTS.map(p => `
    <button class="quick-prompt" onclick="sendMessage(${JSON.stringify(p)})">${p}</button>
  `).join("");

  emptyChips.innerHTML = QUICK_PROMPTS.slice(0, 3).map(p => `
    <button class="chip" onclick="sendMessage(${JSON.stringify(p)})">${p}</button>
  `).join("");
}

/* ─────────────────────────────────────────────
   Input sizing
───────────────────────────────────────────── */
chatInput.addEventListener("input", () => {
  chatInput.style.height = "auto";
  chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + "px";
  sendBtn.disabled = !chatInput.value.trim();
});

chatInput.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    const val = chatInput.value.trim();
    if (val && !loading) sendMessage(val);
  }
});

sendBtn.addEventListener("click", () => {
  const val = chatInput.value.trim();
  if (val && !loading) sendMessage(val);
});

/* ─────────────────────────────────────────────
   Messaging
───────────────────────────────────────────── */
function portfolioCtx() {
  if (!holdings.length) return "No current holdings.";
  return holdings.map(h => `${h.ticker}: ${h.shares} shares${h.avgCost ? " @ avg $"+h.avgCost : ""}`).join(", ");
}

function fmtTime(d) {
  return d.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });
}

function extractJSON(text) {
  const m = text.match(/```json\s*([\s\S]*?)```/);
  if (m) { try { const p = JSON.parse(m[1]); return p.recommendations || []; } catch {} }
  return [];
}

function cleanText(text) {
  return text.replace(/```json[\s\S]*?```/g, "").trim();
}

function recCardHTML(r) {
  const ac = (r.action || "hold").toLowerCase();
  const conf = r.confidence || 0;
  return `
    <div class="rec-card ${ac}">
      <div class="rec-top">
        <span class="rec-ticker">${r.ticker}</span>
        <span class="action-badge ${ac}">${r.action}</span>
      </div>
      <div class="rec-name">${r.name || ""}</div>
      <div class="conf-row">
        <span>Confidence</span>
        <span class="conf-val ${ac}">${conf}%</span>
      </div>
      <div class="conf-bar"><div class="conf-fill ${ac}" style="width:${conf}%"></div></div>
      <div class="price-grid">
        ${r.entry    ? `<div class="price-item"><div class="price-label">Entry</div><div class="price-val">$${r.entry}</div></div>` : ""}
        ${r.target   ? `<div class="price-item"><div class="price-label">Target</div><div class="price-val">$${r.target}</div></div>` : ""}
        ${r.stopLoss ? `<div class="price-item"><div class="price-label">Stop</div><div class="price-val">$${r.stopLoss}</div></div>` : ""}
        ${r.holdingPeriod ? `<div class="price-item"><div class="price-label">Hold</div><div class="price-val" style="font-size:10px">${r.holdingPeriod}</div></div>` : ""}
      </div>
    </div>`;
}

function appendMessage(msg) {
  const wrap = document.createElement("div");
  wrap.className = `msg msg-${msg.role === "user" ? "user" : "ai"}`;

  const meta = document.createElement("div");
  meta.className = "msg-meta";
  meta.textContent = (msg.role === "user" ? "You" : "Apex Analyst") + " · " + fmtTime(msg.time);

  const bubble = document.createElement("div");
  bubble.className = "msg-bubble";
  bubble.textContent = msg.content;

  wrap.appendChild(meta);
  wrap.appendChild(bubble);

  if (msg.recs && msg.recs.length > 0) {
    const label = document.createElement("div");
    label.className = "parsed-label";
    label.textContent = `${msg.recs.length} recommendation${msg.recs.length > 1 ? "s" : ""}`;

    const grid = document.createElement("div");
    grid.className = "recs-grid";
    grid.innerHTML = msg.recs.map(recCardHTML).join("");

    wrap.appendChild(label);
    wrap.appendChild(grid);
  }

  messagesEl.appendChild(wrap);
  scrollBottom();
}

function scrollBottom() {
  setTimeout(() => { chatWrap.scrollTop = chatWrap.scrollHeight; }, 50);
}

async function sendMessage(text) {
  if (!text || loading) return;
  loading = true;
  sendBtn.disabled = true;
  chatInput.value = "";
  chatInput.style.height = "auto";

  // Hide empty state
  emptyState.style.display = "none";

  const now = new Date();
  const userMsg = { role: "user", content: text, time: now };
  messages.push(userMsg);
  appendMessage(userMsg);

  // Show typing
  loadingEl.style.display = "block";
  scrollBottom();

  // Build API messages — inject portfolio context into every user turn
  const ctx = `\n\n[PORTFOLIO: ${portfolioCtx()}]\n[TIME: ${now.toLocaleString("en-US", { timeZone: "America/New_York" })} ET]`;
  const apiMsgs = messages.slice(-12).map((m, i, arr) => ({
    role: m.role,
    content: m.role === "user" ? m.content + (i === arr.length - 1 ? ctx : "") : m.content
  }));

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 4000,
        system: SYSTEM_PROMPT,
        messages: apiMsgs,
      }),
    });

    const data = await res.json();
    const fullText = (data.content || []).map(c => c.text || "").join("");
    const recs = extractJSON(fullText);
    const clean = cleanText(fullText);

    loadingEl.style.display = "none";

    const aiMsg = { role: "assistant", content: clean, time: new Date(), recs };
    messages.push(aiMsg);
    appendMessage(aiMsg);

    if (recs.length > 0) {
      latestRecs = recs;
      recsBadge.textContent = recs.length;
      recsBadge.style.display = "inline-flex";
      // Render in recs tab
      recsContent.innerHTML = `<div style="margin-bottom:14px;font-size:13px;color:var(--text2)">Latest recommendations · ${fmtTime(new Date())}</div><div class="recs-grid">${recs.map(recCardHTML).join("")}</div>`;
    }
  } catch (err) {
    loadingEl.style.display = "none";
    const errMsg = { role: "assistant", content: `Error: ${err.message}`, time: new Date(), recs: [] };
    messages.push(errMsg);
    appendMessage(errMsg);
  }

  loading = false;
  sendBtn.disabled = !chatInput.value.trim();
}

/* ─────────────────────────────────────────────
   Init
───────────────────────────────────────────── */
renderHoldings();
renderQuick();
</script>
</body>
</html>
