<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockBuddy — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { mono: ['"JetBrains Mono"', 'monospace'] } } } }</script>
  <script>(function(){var t=localStorage.getItem('sb_theme')||'dark';document.documentElement.setAttribute('data-theme',t);})()</script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <link rel="manifest" href="manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#3fb950" />
</head>
<body class="flex items-center justify-center min-h-screen p-6">

<div class="login-card w-full max-w-sm mx-auto rounded-xl p-10 text-center">

  <!-- Logo -->
  <div class="login-logo mb-3">
    <span class="sidebar-wordmark login-wordmark">
      <span class="stock">Stock</span><span class="buddy">Buddy <small><b>by Fadi</b></small></span>
    </span>
  </div>

  <div id="loginContent"></div>

  <div id="loginError" class="login-error" style="display:none"></div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>
const FIREBASE_READY = !!(
  window.FIREBASE_CONFIG &&
  window.FIREBASE_CONFIG.apiKey &&
  window.FIREBASE_CONFIG.apiKey !== 'PASTE_YOUR_API_KEY_HERE'
);

let fbApp = null, fbAuth = null;
if (FIREBASE_READY && typeof firebase !== 'undefined') {
  try { fbApp = firebase.initializeApp(window.FIREBASE_CONFIG); fbAuth = firebase.auth(); }
  catch(e) { console.warn('Firebase init failed:', e.message); }
}

const contentEl = document.getElementById('loginContent');

const googleSvg = `<svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M17.64 9.205c0-.639-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/><path d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/></svg>`;

if (!FIREBASE_READY) {
  contentEl.innerHTML = `
    <div class="warning-box">
      <strong>Firebase not configured</strong>
      Open <code>js/firebase-config.js</code> and paste your Firebase project credentials to enable Google sign-in and cloud sync. Until then, the app works fully in local mode.
    </div>
    <p class="login-title">Welcome to StockBuddy</p>
    <p class="login-sub">Your AI-powered daily trading intelligence platform.</p>
    <button onclick="sessionStorage.setItem('sb_guest_mode','1');window.location.href='index.html'" class="login-btn-local">Continue without account →</button>`;
} else {
  contentEl.innerHTML = `
    <p class="login-title">Sign in to StockBuddy</p>
    <p class="login-sub">Sign in to sync your portfolio and watchlist across devices.</p>
    <button id="googleSignInBtn" onclick="signInWithGoogle()" class="login-btn login-btn-google">
      ${googleSvg} Sign in with Google
    </button>
    <div class="login-divider">or</div>
    <button onclick="sessionStorage.setItem('sb_guest_mode','1');window.location.href='index.html'" class="login-btn-local">Continue without account</button>`;

  if (fbAuth) {
    fbAuth.onAuthStateChanged(user => { if (user) window.location.href = 'index.html'; });
  }
}

function signInWithGoogle() {
  if (!fbAuth) return;
  const btn = document.getElementById('googleSignInBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Signing in…'; }
  const provider = new firebase.auth.GoogleAuthProvider();
  fbAuth.signInWithPopup(provider)
    .then(() => { window.location.href = 'index.html'; })
    .catch(err => {
      const errEl = document.getElementById('loginError');
      errEl.textContent = err.message;
      errEl.style.display = 'block';
      if (btn) { btn.disabled = false; btn.innerHTML = googleSvg + ' Sign in with Google'; }
    });
}
</script>
</body>
</html>
