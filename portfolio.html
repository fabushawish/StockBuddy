<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockBuddy — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { mono: ['"JetBrains Mono"', 'monospace'] } } } }</script>
  <script>(function(){var t=localStorage.getItem('sb_theme')||'dark';document.documentElement.setAttribute('data-theme',t);})()</script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <link rel="manifest" href="manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#06b6d4" />
</head>
<body>

<div id="sidebarOverlay"></div>
<nav id="sidebar"></nav>

<div class="lg:ml-56 flex flex-col min-h-screen">

  <header id="sb-topbar"></header>

  <main class="flex-1 p-4 lg:p-7 pb-24 lg:pb-7 w-full max-w-[1360px]">

    <div class="error-box" id="errorBox"></div>

    <div class="loading-box" id="loadingBox">
      <div class="spinner"></div>
      <div class="loading-status"><em id="loadMsg">Loading…</em></div>
      <div id="stepsEl"></div>
    </div>

    <div class="portfolio-section" id="portfolioSection">
      <div class="portfolio-header" onclick="togglePortfolioCollapse(event)">
        <div>
          <div class="portfolio-title"><i class="fa-solid fa-chart-pie"></i> My Portfolio <span id="portfolioChevron" class="portfolio-chevron"><i class="fa-solid fa-chevron-down"></i></span></div>
          <div class="portfolio-sub" id="portfolioSub">No holdings tracked</div>
        </div>
        <div class="portfolio-header-actions" onclick="event.stopPropagation()">
          <select id="sortSelect" class="portfolio-model-select" onchange="handleSort(this.value)">
            <option value="value-desc">Value ↓</option>
            <option value="value-asc">Value ↑</option>
            <option value="roi-desc">ROI ↓</option>
            <option value="roi-asc">ROI ↑</option>
          </select>
          <select id="modelSelect" class="portfolio-model-select">
            <option value="claude-haiku-4-5-20251001" selected>Haiku 4.5</option>
            <option value="claude-sonnet-4-6">Sonnet 4.6</option>
            <option value="claude-opus-4-7">Opus 4.7</option>
          </select>
          <button class="btn btn-ghost" onclick="toggleAddForm()"><i class="fa-solid fa-plus"></i> Add Position</button>
          <button class="btn btn-ghost" id="refreshPricesBtn" onclick="manualRefreshPrices()"><i class="fa-solid fa-rotate"></i> Prices</button>
          <button class="btn btn-primary" id="analysePortBtn" onclick="analysePortfolio()"><i class="fa-solid fa-magnifying-glass"></i> Analyse</button>
        </div>
      </div>
      <div id="portfolioBody">
        <div class="portfolio-add-form" id="addPosForm">
          <input class="port-ticker-input" id="posTickerInput" placeholder="AAPL" autocomplete="off"
                 onkeydown="if(event.key==='Enter')addPosition()" />
          <input class="port-num-input" id="posSharesInput" type="number" placeholder="Shares" min="0.001" step="any"
                 onkeydown="if(event.key==='Enter')addPosition()" />
          <input class="port-num-input" id="posCostInput" type="number" placeholder="Avg cost $" min="0.01" step="0.01"
                 onkeydown="if(event.key==='Enter')addPosition()" />
          <button class="btn btn-primary" onclick="addPosition()">Add</button>
          <button class="btn btn-ghost"   onclick="toggleAddForm()">Cancel</button>
        </div>
        <div id="portfolioGlance" class="portfolio-glance" style="display:none"></div>
        <div id="portfolioCharts" style="display:none">
          <div class="port-charts-header" onclick="toggleCharts()">
            <span class="port-charts-title"><i class="fa-solid fa-chart-simple"></i> Performance Charts</span>
            <span id="chartsChevron" class="portfolio-chevron"><i class="fa-solid fa-chevron-down"></i></span>
          </div>
          <div id="chartsBody" style="display:none">
            <div class="port-charts-grid">
              <div class="port-chart-box">
                <div class="port-chart-label">Allocation</div>
                <canvas id="allocChart"></canvas>
              </div>
              <div class="port-chart-box">
                <div class="port-chart-label">Return by Position</div>
                <div id="roiChartWrap" style="position:relative">
                  <canvas id="roiChart"></canvas>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div id="portfolioCards"></div>
      </div>
    </div>

  </main>
</div>

<nav id="sb-bottomnav"></nav>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>window.SB_PAGE = 'portfolio';</script>
<script src="js/nav.js"></script>
<script src="js/shared.js"></script>
<script>
let _portPriceMap   = {};
let _portAiSugs     = [];
let _portAiAnalysis = {};
let _portSort       = 'value-desc';
let _allocChart      = null;
let _roiChart        = null;
let _chartsExpanded  = false;
let _lastChartData   = [];

function getCSSVar(v) {
  return getComputedStyle(document.documentElement).getPropertyValue(v).trim();
}

function toggleCharts() {
  _chartsExpanded = !_chartsExpanded;
  const body    = document.getElementById('chartsBody');
  const chevron = document.getElementById('chartsChevron');
  body.style.display    = _chartsExpanded ? 'block' : 'none';
  chevron.innerHTML     = _chartsExpanded
    ? '<i class="fa-solid fa-chevron-up"></i>'
    : '<i class="fa-solid fa-chevron-down"></i>';
  if (_chartsExpanded) {
    renderPortfolioCharts(_lastChartData);
  } else {
    if (_allocChart) { _allocChart.destroy(); _allocChart = null; }
    if (_roiChart)   { _roiChart.destroy();   _roiChart   = null; }
  }
}

function renderPortfolioCharts(data) {
  const el = document.getElementById('portfolioCharts');
  if (!data.length) { el.style.display = 'none'; return; }
  el.style.display = 'block';

  const PALETTE  = ['#06b6d4','#38bdf8','#818cf8','#34d399','#fb923c','#f472b6','#a78bfa','#22d3ee','#4ade80','#fbbf24','#e879f9','#f97316'];
  const textDim  = getCSSVar('--text-dim');
  const bg2      = getCSSVar('--bg2');
  const gridCol  = getCSSVar('--border');

  if (_allocChart) { _allocChart.destroy(); _allocChart = null; }
  if (_roiChart)   { _roiChart.destroy();   _roiChart   = null; }

  // ── Allocation donut ──────────────────────────────
  _allocChart = new Chart(document.getElementById('allocChart'), {
    type: 'doughnut',
    data: {
      labels: data.map(d => d.ticker),
      datasets: [{
        data:            data.map(d => parseFloat(d.value.toFixed(2))),
        backgroundColor: data.map((_, i) => PALETTE[i % PALETTE.length]),
        borderColor:     bg2,
        borderWidth:     2,
        hoverBorderWidth: 3,
      }],
    },
    options: {
      responsive: true,
      cutout: '60%',
      plugins: {
        legend: {
          position: 'right',
          labels: { color: textDim, font: { size: 11, weight: '600' }, padding: 10, boxWidth: 10, boxHeight: 10 },
        },
        tooltip: {
          callbacks: {
            label(ctx) {
              const val = ctx.parsed;
              const tot = ctx.dataset.data.reduce((a, b) => a + b, 0);
              return ` $${val.toFixed(2)} (${(val / tot * 100).toFixed(1)}%)`;
            },
          },
        },
      },
    },
  });

  // ── ROI horizontal bar ────────────────────────────
  const sorted   = [...data].sort((a, b) => b.roi - a.roi);
  const roiWrap  = document.getElementById('roiChartWrap');
  roiWrap.style.height = Math.max(160, sorted.length * 34) + 'px';

  _roiChart = new Chart(document.getElementById('roiChart'), {
    type: 'bar',
    data: {
      labels: sorted.map(d => d.ticker),
      datasets: [{
        data:            sorted.map(d => parseFloat(d.roi.toFixed(2))),
        backgroundColor: sorted.map(d => d.roi >= 0 ? 'rgba(16,185,129,.65)' : 'rgba(244,63,94,.65)'),
        borderColor:     sorted.map(d => d.roi >= 0 ? '#10b981' : '#f43f5e'),
        borderWidth:     1,
        borderRadius:    4,
      }],
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label(ctx) { return ` ${ctx.parsed.x >= 0 ? '+' : ''}${ctx.parsed.x.toFixed(2)}%`; },
          },
        },
      },
      scales: {
        x: {
          grid:   { color: gridCol },
          ticks:  { color: textDim, callback: v => v + '%', font: { size: 11 } },
          border: { color: 'transparent' },
        },
        y: {
          grid:   { display: false },
          ticks:  { color: textDim, font: { family: '"JetBrains Mono"', size: 12, weight: '700' } },
          border: { color: 'transparent' },
        },
      },
    },
  });
}

function handleSort(val) {
  _portSort = val;
  renderPortfolio(_portPriceMap, _portAiSugs);
}

function showError(msg) { const el = document.getElementById('errorBox'); el.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> ' + msg; el.classList.add('active'); }
function clearError()   { document.getElementById('errorBox').classList.remove('active'); }
function updateLoad(msg){ document.getElementById('loadMsg').innerHTML = `<em>${msg}</em>`; }
function startLoading() { document.getElementById('loadingBox').classList.add('active'); document.getElementById('stepsEl').innerHTML = ''; updateLoad('Loading…'); }
function stopLoading()  { document.getElementById('loadingBox').classList.remove('active'); }

function togglePortfolioCollapse(e) {
  if (e && e.target.closest('button,input,select')) return;
  const body    = document.getElementById('portfolioBody');
  const chevron = document.getElementById('portfolioChevron');
  const collapsed = body.classList.toggle('collapsed');
  chevron.innerHTML = collapsed ? '<i class="fa-solid fa-chevron-right"></i>' : '<i class="fa-solid fa-chevron-down"></i>';
}

function toggleAddForm() {
  const f = document.getElementById('addPosForm');
  const show = f.style.display !== 'flex';
  f.style.display = show ? 'flex' : 'none';
  if (show) document.getElementById('posTickerInput').focus();
}

function addPosition() {
  const ticker  = (document.getElementById('posTickerInput').value || '').trim().toUpperCase();
  const shares  = parseFloat(document.getElementById('posSharesInput').value);
  const avgCost = parseFloat(document.getElementById('posCostInput').value);
  if (!ticker || isNaN(shares) || isNaN(avgCost) || shares <= 0 || avgCost <= 0) { showError('Enter ticker, number of shares, and average cost.'); return; }
  const p = loadPortfolio();
  p[ticker] = { shares, avgCost };
  savePortfolio(p);
  document.getElementById('posTickerInput').value = '';
  document.getElementById('posSharesInput').value = '';
  document.getElementById('posCostInput').value   = '';
  toggleAddForm();
  renderPortfolio(_portPriceMap, _portAiSugs);
  fetchPortfolioPrices();
}

function removePosition(ticker) {
  const p = loadPortfolio();
  delete p[ticker];
  delete _portAiAnalysis[ticker];
  localStorage.setItem('sb_portfolio', JSON.stringify(p));
  // Use FieldValue.delete() with dot-notation path — the only reliable way to
  // remove a key from a Firestore map field (merge:true does NOT deep-delete).
  if (sbDb && sbUser) {
    sbDb.collection('users').doc(sbUser.uid).update({
      [`portfolio.${ticker}`]: firebase.firestore.FieldValue.delete(),
    }).catch(e => console.warn('Firestore delete failed:', e.message));
  }
  renderPortfolio(_portPriceMap, _portAiSugs);
}

function editPosition(ticker) {
  const { shares, avgCost } = loadPortfolio()[ticker];
  const card = document.getElementById(`holding-card-${ticker}`);
  card.innerHTML = `
    <div class="holding-edit-form">
      <label class="edit-label">Ticker</label>
      <input class="edit-input" id="edit-ticker-${ticker}" value="${ticker}"
             oninput="this.value=this.value.toUpperCase()"
             style="font-family:'JetBrains Mono',monospace;font-weight:700" />
      <label class="edit-label">Shares</label>
      <input class="edit-input" type="number" id="edit-shares-${ticker}" value="${shares}" min="0.001" step="any" />
      <label class="edit-label">Avg cost ($)</label>
      <input class="edit-input" type="number" id="edit-cost-${ticker}" value="${avgCost}" min="0.01" step="0.01" />
      <div class="edit-form-actions">
        <button class="btn btn-primary" onclick="saveEdit('${ticker}')">Save</button>
        <button class="btn btn-ghost"   onclick="renderPortfolio(_portPriceMap,_portAiSugs)">Cancel</button>
      </div>
    </div>`;
}

function saveEdit(oldTicker) {
  const newTicker = (document.getElementById(`edit-ticker-${oldTicker}`).value || '').trim().toUpperCase();
  const shares    = parseFloat(document.getElementById(`edit-shares-${oldTicker}`).value);
  const avgCost   = parseFloat(document.getElementById(`edit-cost-${oldTicker}`).value);
  if (!newTicker)                                                        { showError('Ticker cannot be empty.'); return; }
  if (isNaN(shares) || isNaN(avgCost) || shares <= 0 || avgCost <= 0)  { showError('Invalid shares or cost.'); return; }
  const p = loadPortfolio();
  if (newTicker !== oldTicker) {
    if (p[newTicker]) { showError(`${newTicker} already exists in portfolio.`); return; }
    delete p[oldTicker];
    delete _portAiAnalysis[oldTicker];
    if (sbDb && sbUser) {
      sbDb.collection('users').doc(sbUser.uid).update({
        [`portfolio.${oldTicker}`]: firebase.firestore.FieldValue.delete(),
      }).catch(e => console.warn('Firestore delete failed:', e.message));
    }
  }
  p[newTicker] = { shares, avgCost };
  savePortfolio(p);
  renderPortfolio(_portPriceMap, _portAiSugs);
}

function portfolioSignal(ticker, pnlPct, aiSugs) {
  const ai = _portAiAnalysis[ticker];
  if (ai) {
    const map = {
      'STRONG BUY':{ cls:'sig-buy',  label:'<i class="fa-solid fa-bolt"></i> STRONG BUY' },
      'BUY MORE':  { cls:'sig-buy',  label:'<i class="fa-solid fa-arrow-trend-up"></i> BUY MORE'   },
      'HOLD':      { cls:'sig-hold', label:'<i class="fa-solid fa-minus"></i> HOLD'                 },
      'REDUCE':    { cls:'sig-cut',  label:'<i class="fa-solid fa-arrow-down"></i> REDUCE'          },
      'SELL':      { cls:'sig-sell', label:'<i class="fa-solid fa-arrow-trend-down"></i> SELL'      },
    };
    return map[ai.signal] || { cls:'sig-hold', label:'<i class="fa-solid fa-minus"></i> HOLD' };
  }
  const hit = aiSugs.find(s => s.ticker === ticker);
  if (hit) return hit.action === 'BUY'
    ? { cls:'sig-buy',  label:'<i class="fa-solid fa-arrow-trend-up"></i> BUY MORE — AI PICK' }
    : { cls:'sig-sell', label:'<i class="fa-solid fa-arrow-trend-down"></i> SELL — AI PICK'   };
  if (pnlPct <= -7)  return { cls:'sig-cut',  label:'<i class="fa-solid fa-scissors"></i> CUT LOSS'  };
  if (pnlPct >= 20)  return { cls:'sig-take', label:'<i class="fa-solid fa-coins"></i> TAKE PROFIT' };
  return { cls:'sig-hold', label:'<i class="fa-solid fa-minus"></i> HOLD' };
}

function loadPortfolioAiCache() {
  const cached = getCache(CACHE_KEYS.portfolio);
  if (!cached) return;
  const ageH = (Date.now() - cached.ts) / 3600000;
  if (ageH > 24) return;
  _portAiAnalysis = cached.data;
  const btn = document.getElementById('analysePortBtn');
  if (btn) btn.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> Re-analyse';
}

async function analysePortfolio() {
  const apiKey = localStorage.getItem('sb_key');
  if (!apiKey) { showError('Anthropic API key required. Go to Settings.'); return; }
  clearAllCaches();
  const portfolio = loadPortfolio();
  const tickers   = Object.keys(portfolio);
  if (!tickers.length) return;
  const model = document.getElementById('modelSelect').value;
  const btn   = document.getElementById('analysePortBtn');
  btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> Analysing…';
  document.querySelectorAll('.holding-analysis').forEach(el => {
    el.innerHTML = '<span class="holding-conf">Analysing fundamentals…</span>';
  });
  const sysPrompt = 'You are a high-conviction portfolio analyst. Risk tolerance: HIGH — aggressive growth, momentum, and turnaround plays are fine when backed by fundamentals or a clear catalyst. Reject pure meme speculation with no thesis.\n\nAnalyse each ticker using your knowledge of its business model, recent earnings trajectory, analyst consensus, sector tailwinds/headwinds, valuation, and momentum as of your training data. Be direct and opinionated.\n\nSignal options: STRONG BUY | BUY MORE | HOLD | REDUCE | SELL\n\nReturn ONLY valid JSON in <json_data> tags:\n<json_data>\n{"analyses":[{"ticker":"AAPL","signal":"HOLD","confidence_pct":78,"reason":"1-2 sentence thesis with specific fundamental or catalyst","risk":"Primary risk factor"}]}\n</json_data>\n\nOutput ONLY the <json_data> block — nothing before or after.';
  try {
    const today = new Date().toLocaleDateString('en-US', { timeZone:'America/New_York', weekday:'long', year:'numeric', month:'long', day:'numeric' });
    const BATCH_SIZE = 10;
    const allAnalyses = [];
    const totalBatches = Math.ceil(tickers.length / BATCH_SIZE);
    for (let bi = 0; bi < tickers.length; bi += BATCH_SIZE) {
      const batch    = tickers.slice(bi, bi + BATCH_SIZE);
      const batchNum = Math.floor(bi / BATCH_SIZE) + 1;
      btn.innerHTML = totalBatches > 1 ? `<i class="fa-solid fa-magnifying-glass"></i> Analysing batch ${batchNum}/${totalBatches}…` : '<i class="fa-solid fa-magnifying-glass"></i> Analysing…';
      const holdingsList = batch.map(t => {
        const p = _portPriceMap[t];
        const cur = p ? (p.extPrice ?? p.price) : null;
        const { shares, avgCost } = portfolio[t];
        const pnlPct = cur ? ((cur - avgCost) / avgCost * 100).toFixed(1) + '%' : 'unknown';
        return `${t}: ${shares} shares @ avg $${avgCost.toFixed(2)}, current ${cur ? '$' + cur.toFixed(2) : 'unknown'}, P&L ${pnlPct}`;
      }).join('\n');
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true' },
        body: JSON.stringify({ model, max_tokens:4000, system:sysPrompt, messages:[{role:'user',content:`Today: ${today}\n\nAnalyse each holding below using your knowledge of fundamentals, earnings trajectory, analyst consensus, and sector context. Give a high-conviction signal for each:\n\n${holdingsList}`}] }),
      });
      if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.error?.message || `HTTP ${res.status}`); }
      const data = await res.json();
      if (data.type === 'error') throw new Error(data.error?.message || 'API error');
      const text = extractText(data);
      let parsed;
      try { parsed = parseAnalysis(text); }
      catch (parseErr) { if (!parseErr.message.startsWith('PARSE_FAIL:')) throw parseErr; const fixedText = await reformatAsJson(apiKey, model, text); parsed = parseAnalysis(fixedText); }
      allAnalyses.push(...(parsed.analyses || []));
    }
    _portAiAnalysis = {};
    allAnalyses.forEach(a => { _portAiAnalysis[a.ticker] = { signal:a.signal, confidence:a.confidence_pct, reason:a.reason, risk:a.risk }; });
    setCache(CACHE_KEYS.portfolio, _portAiAnalysis);
    renderPortfolio(_portPriceMap, _portAiSugs);
  } catch (err) {
    showError('Portfolio analysis failed: ' + err.message);
    document.querySelectorAll('.holding-analysis').forEach(el => { el.innerHTML = ''; });
  } finally {
    btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> Re-analyse';
  }
}

function renderPortfolio(priceMap, aiSugs) {
  _portPriceMap = priceMap || {};
  _portAiSugs   = aiSugs   || [];
  const portfolio = loadPortfolio();
  const tickers   = Object.keys(portfolio);
  const cardsEl   = document.getElementById('portfolioCards');
  const subEl     = document.getElementById('portfolioSub');
  const glanceEl  = document.getElementById('portfolioGlance');
  if (!tickers.length) {
    cardsEl.innerHTML   = '<div class="portfolio-empty">No holdings yet. Click <strong>+ Add Position</strong> to start tracking.</div>';
    subEl.textContent   = 'No holdings tracked';
    glanceEl.style.display = 'none';
    return;
  }
  // Sort holdings
  const sortedTickers = [...tickers];
  const [sortBy, sortDir] = _portSort.split('-');
  sortedTickers.sort((a, b) => {
    const pa = _portPriceMap[a], pb = _portPriceMap[b];
    if (sortBy === 'value') {
      const va = pa ? portfolio[a].shares * (pa.extPrice ?? pa.price) : 0;
      const vb = pb ? portfolio[b].shares * (pb.extPrice ?? pb.price) : 0;
      return sortDir === 'desc' ? vb - va : va - vb;
    }
    if (sortBy === 'roi') {
      const ca = pa ? (pa.extPrice ?? pa.price) : null;
      const cb = pb ? (pb.extPrice ?? pb.price) : null;
      const ra = ca != null ? (ca - portfolio[a].avgCost) / portfolio[a].avgCost * 100 : (sortDir === 'desc' ? -Infinity : Infinity);
      const rb = cb != null ? (cb - portfolio[b].avgCost) / portfolio[b].avgCost * 100 : (sortDir === 'desc' ? -Infinity : Infinity);
      return sortDir === 'desc' ? rb - ra : ra - rb;
    }
    return 0;
  });

  let totalValue = 0, totalCost = 0, priced = 0;
  const cards = sortedTickers.map(ticker => {
    const { shares, avgCost } = portfolio[ticker];
    const p   = _portPriceMap[ticker];
    const cur = p ? (p.extPrice ?? p.price) : null;
    const cost = shares * avgCost;
    totalCost += cost;
    let priceHtml, roiRowHtml, footerVal, pnlPct = 0;
    let signal = { cls:'sig-hold', label:'<i class="fa-solid fa-minus"></i> HOLD' };
    if (cur) {
      priced++;
      const value = shares * cur;
      const pnl   = value - cost;
      pnlPct      = ((cur - avgCost) / avgCost) * 100;
      totalValue += value;
      const up = pnl >= 0;
      priceHtml  = `<span class="holding-price ${up?'up':'down'}">$${cur.toFixed(2)}</span>`;
      roiRowHtml = `<div class="holding-roi-row"><span class="holding-roi-pct ${up?'up':'down'}">ROI ${up?'+':''}${pnlPct.toFixed(2)}%</span><span class="holding-roi-pnl ${up?'up':'down'}">${up?'+':'-'}$${Math.abs(pnl).toFixed(2)}</span></div>`;
      footerVal  = `Value: $${value.toFixed(2)}`;
      signal     = portfolioSignal(ticker, pnlPct, _portAiSugs);
    } else {
      priceHtml  = `<span class="holding-price dim">No price</span>`;
      roiRowHtml = '';
      footerVal  = `Cost: $${cost.toFixed(2)}`;
      signal     = portfolioSignal(ticker, 0, _portAiSugs);
    }
    const ai = _portAiAnalysis[ticker];
    const analysisHtml = ai
      ? `<div class="holding-analysis"><div class="holding-reason">${ai.reason}</div>${ai.risk?`<div class="holding-risk"><i class="fa-solid fa-triangle-exclamation"></i> ${ai.risk}</div>`:''}<div class="holding-conf">Confidence: ${ai.confidence}%</div></div>`
      : `<div class="holding-analysis"></div>`;
    return `<div class="holding-card" id="holding-card-${ticker}"><div class="holding-top"><div><div class="holding-ticker">${ticker}</div><div class="holding-meta">${shares} shares &middot; avg $${avgCost.toFixed(2)} &middot; cost $${cost.toFixed(2)}</div></div><span class="sig ${signal.cls}">${signal.label}</span></div><div class="holding-price-row">${priceHtml}</div>${roiRowHtml}${analysisHtml}<div class="holding-footer"><span class="holding-value">${footerVal}</span><div class="holding-footer-actions"><button class="holding-edit" onclick="editPosition('${ticker}')"><i class="fa-solid fa-pen"></i> Edit</button><button class="holding-remove" onclick="removePosition('${ticker}')"><i class="fa-solid fa-xmark"></i> Remove</button></div></div></div>`;
  }).join('');
  cardsEl.innerHTML = `<div class="portfolio-cards-grid">${cards}</div>`;
  staggerCards(cardsEl);
  const totalPnl    = totalValue - totalCost;
  const totalPnlPct = totalCost > 0 ? (totalPnl / totalCost) * 100 : 0;
  const up          = totalPnl >= 0;
  if (totalValue > 0) {
    glanceEl.style.display = 'flex';
    glanceEl.innerHTML = `<div class="port-glance-stat"><span class="port-glance-label">Overall ROI</span><span class="port-roi-big ${up?'up':'down'}">${up?'+':''}${totalPnlPct.toFixed(2)}%</span></div><div class="port-glance-stat"><span class="port-glance-label">Total Value</span><span class="port-glance-val">$${totalValue.toFixed(2)}</span></div><div class="port-glance-stat"><span class="port-glance-label">Total P&amp;L</span><span class="port-glance-val ${up?'up':'down'}">${up?'+':'-'}$${Math.abs(totalPnl).toFixed(2)}</span></div><div class="port-glance-stat"><span class="port-glance-label">Holdings</span><span class="port-glance-val">${tickers.length}</span></div>`;
    subEl.textContent = `${priced} of ${tickers.length} priced · Cost basis $${totalCost.toFixed(2)}`;
  } else {
    glanceEl.style.display = 'none';
    subEl.textContent = `${tickers.length} holdings · Cost basis: $${totalCost.toFixed(2)}`;
  }

  // Charts
  _lastChartData = tickers.map(t => {
    const p = _portPriceMap[t];
    if (!p) return null;
    const cur = p.extPrice ?? p.price;
    const { shares, avgCost } = portfolio[t];
    return { ticker: t, value: shares * cur, roi: (cur - avgCost) / avgCost * 100 };
  }).filter(Boolean);
  const chartsEl = document.getElementById('portfolioCharts');
  if (_lastChartData.length) {
    chartsEl.style.display = 'block';
    if (_chartsExpanded) renderPortfolioCharts(_lastChartData);
  } else {
    chartsEl.style.display = 'none';
  }
}

async function fetchPortfolioPrices() {
  const portfolio = loadPortfolio();
  const tickers   = Object.keys(portfolio);
  if (!tickers.length) return;
  const btn   = document.getElementById('refreshPricesBtn');
  const subEl = document.getElementById('portfolioSub');
  if (btn)   { btn.disabled = true; btn.textContent = '↻ Loading…'; }
  if (subEl) { subEl.textContent = 'Loading prices…'; }
  try {
    const rows = await fetchLivePricesYahoo(tickers);
    rows.forEach(r => { _portPriceMap[r.ticker] = r; });
    renderPortfolio(_portPriceMap, _portAiSugs);
  } catch (e) {
    if (subEl) subEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Price fetch failed: ${e.message}`;
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-rotate"></i> Prices'; }
  }
}

async function manualRefreshPrices() { _portPriceMap = {}; await fetchPortfolioPrices(); }

requireAuth(function(user) {
  initSharedUI('portfolio');
  loadPortfolioAiCache();
  renderPortfolio({}, []);
  fetchPortfolioPrices();
  const saved = localStorage.getItem('sb_model');
  if (saved) { const sel = document.getElementById('modelSelect'); if (sel) sel.value = saved; }
});
</script>
